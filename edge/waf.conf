# ═══════════════════════════════════════════════════════════════════════
# edge/waf.conf — WAF-artige Request-Filter (http-Kontext)
# Wird von nginx.conf im http-Block per include eingebunden.
#
# Aufbau:
#   - Rate-Limit-/Connection-Limit-Zonen
#   - Maps, die verdächtige Requests mit "1" markieren (Sauber trennbar
#     und testbar: jede Kategorie hat ihr eigenes Flag)
#   - eine Zusammenfassungs-Map $waf_blocked
#
# Die Auswertung erfolgt im Server-Block von nginx.conf über genau zwei
# if-Abfragen (if + return ist die sichere Ausnahme des "evil if"):
#     if ($waf_bad_method = 1) { return 405; }
#     if ($waf_blocked = 1)    { return 403; }
#
# Hinweis zu den Regex: absichtlich ohne Backslash-Zweideutigkeiten —
# Whitespaces/Trennzeichen werden als Zeichenklasse [ \t/*] plus die
# Prozent-Kodierungen %20/%09/%2b/+ geschrieben (nginx dekodiert Query-
# Strings nicht!), literale Punkte = [.] bzw. %2E, Klammern = [(]/%28.
# ═══════════════════════════════════════════════════════════════════════

# ── Rate-Limiting / Connection-Limiting pro Client-IP ─────────────────
limit_req_zone    $binary_remote_addr zone=req_per_ip:10m   rate=10r/s;
limit_req_status  429;
limit_conn_zone   $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_status 429;

# ── 1) HTTP-Methodenfilter: nur GET/POST ist erlaubt ──────────────────
map $request_method $waf_bad_method {
    default 1;    # PUT/DELETE/PATCH/OPTIONS/TRACE/HEAD/… → 405
    GET     0;
    POST    0;
}

# ── 2) Fehlender/leerer Host-Header ───────────────────────────────────
map $http_host $waf_bad_host {
    ""      1;
    default 0;
}

# ── 3) Scanner-/Exploit-User-Agents sowie leerer User-Agent ──────────
map $http_user_agent $waf_bad_ua {
    default 0;
    ""      1;    # kein User-Agent → verdächtig
    "~*(sqlmap|nikto|nmap|masscan|zgrab|zmeu|nessus|openvas|acunetix|netsparker|havij|dirbuster|gobuster|feroxbuster|wpscan|joomscan|whatweb|nuclei|jaeles|metasploit|w3af|arachni|httrack|libwww-perl|python-requests|go-http-client|winhttp|morfeus)" 1;
}

# ── 4) SQL-Injection-Muster ───────────────────────────────────────────
# Prüft $request_uri (roh) UND $args. Wichtig: nginx dekodiert Query-
# Strings NICHT, daher akzeptieren die Muster Trennzeichen/Operatoren
# sowohl literal (Space, Tab, /**/) als auch Prozent-kodiert (%20, +,
# %3D, %28 …). Angewendet auf URI- UND Query-String.
map "$request_uri&$args" $waf_sqli {
    default 0;
    "~*(union([ \t/*]|%20|%09|%2[bB]|[+])+(all([ \t/*]|%20|%09|%2[bB]|[+])+)?select|select([ \t/*]|%20|%09|%2[bB]|[+])+.+([ \t/*]|%20|%09|%2[bB]|[+])+from|insert([ \t/*]|%20|%09|%2[bB]|[+])+into|update([ \t/*]|%20|%09|%2[bB]|[+])+.+([ \t/*]|%20|%09|%2[bB]|[+])+set|delete([ \t/*]|%20|%09|%2[bB]|[+])+from|drop([ \t/*]|%20|%09|%2[bB]|[+])+(table|database)|alter([ \t/*]|%20|%09|%2[bB]|[+])+table|(or|and)([ \t/*']|%20|%09|%2[bB]|[+]|%27)+1([ \t/*']|%20|%09|%2[bB]|[+]|%27)*([=]|%3[dD])([ \t/*']|%20|%09|%2[bB]|[+]|%27)*1|benchmark([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28)|sleep([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28)|load_file([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28)|into([ \t/*]|%20|%09|%2[bB]|[+])+(out|dump)file|information_schema|xp_cmdshell|waitfor([ \t/*]|%20|%09|%2[bB]|[+])+delay|@@version|version([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28))" 1;
}

# ── 5) XSS-Muster (ebenfalls literal + Prozent-kodierungstolerant) ───
map "$request_uri&$args" $waf_xss {
    default 0;
    "~*(([<]|%3[cC])script|([<]|%3[cC])/script|javascript([:]|%3[aA])|vbscript([:]|%3[aA])|data:text/html|([<]|%3[cC])(iframe|object|embed|svg)|on(error|load|click|mouseover|focus|submit)([ \t/*]|%20|%09|%2[bB]|[+])*([=]|%3[dD])|document([.]|%2[eE])(cookie|domain|write)|fromcharcode|expression([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28)|alert([ \t/*]|%20|%09|%2[bB]|[+])*([(]|%28))" 1;
}

# ── 6) Path-Traversal / Null-Bytes / Systemdateien ────────────────────
# Deckt alle Mischformen ab: ../  ..%2f  %2e%2e/  %2e./  .%2e%2f
# %252e%252e (doppelt kodiert)  %00  sowie /etc/passwd in kodierter Form.
map "$request_uri&$args" $waf_traversal {
    default 0;
    "~*(([.]|%2[eE])([.]|%2[eE])(/|%2[fF]|%5[cC])|%252[eE]%252[eE]|%00|%2500|/etc(%2[fF]|/)(passwd|shadow)|/proc(%2[fF]|/)self|boot[.]ini)" 1;
}

# ── 7) Bekannte Scanner-/Exploit-Pfade und Backup-Reste ──────────────
map $uri $waf_bad_path {
    default 0;
    "~*(^/([.]env|[.]git|[.]svn|[.]htaccess|[.]htpasswd|[.]aws|[.]docker|docker-compose|wp-admin|wp-login|wp-config|phpmyadmin|pma|adminer|actuator|cgi-bin|vendor/)|[.](bak|old|orig|swp|sql|log|ini|conf|sh)$)" 1;
}

# ── Zusammenfassung: ein Flag, eine Entscheidung ─────────────────────
# Der Quell-String enthält alle Teilflags (0/1); sobald darin eine "1"
# steht, wird der Request verworfen.
map "$waf_bad_method$waf_bad_host$waf_bad_ua$waf_sqli$waf_xss$waf_traversal$waf_bad_path" $waf_blocked {
    default 0;
    "~1"    1;
}
