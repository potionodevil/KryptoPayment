# ═══════════════════════════════════════════════════════════════════════
# edge/nginx.conf — Vorgeschalteter Sicherheits-Layer (Reverse-Proxy)
# Krypto Payment Gateway — sitzt VOR der Node-Gateway-API (gateway:4000).
#
# Prüfkette pro Request (alles vor dem Proxy, also bevor die Anwendung
# erreicht wird):
#   1. IP-Whitelist  → 403 für alles, was nicht in IP_WHITELIST steht
#                      (geo + allow/deny, generiert aus der Env-Variable)
#   2. WAF-Filter    → 405 (unerlaubte Methode) / 403 (Scanner, SQLi,
#                      XSS, Path-Traversal, fehlende Header) — siehe waf.conf
#   3. Rate-Limit    → 429 bei Brute-Force/DoS (pro Client-IP)
#   4. Routing       → NUR /api/ wird an den Upstream proxy_pass't,
#                      alles andere endet mit 404 (kein Listing, kein Fallback)
#
# Env-Verarbeitung: nginx kann Env-Variablen nicht direkt in Direktiven
# einsetzen. entrypoint.sh übersetzt GATEWAY_UPSTREAM und IP_WHITELIST
# nach /etc/nginx/generated/*.conf, die unten per include eingebunden
# werden. Diese Datei selbst bleibt statisch.
#
# Validierung im Container:  docker compose run --rm edge nginx -t
# (siehe edge/README.md)
# ═══════════════════════════════════════════════════════════════════════

user  nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/json;   # API-Gateway: JSON als Default-Type
    charset      utf-8;

    # ── Server-Tokens verstecken, kein Directory-Listing ───────────
    server_tokens off;
    autoindex     off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30s;
    keepalive_requests 100;

    # ── Request-Limits: oversized Bodies abweisen (Payment-APIs
    #    brauchen keine großen Uploads) ─────────────────────────────
    client_max_body_size       64k;
    client_body_buffer_size    64k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_header_timeout      10s;   # Slow-Header-Attacken abwürgen
    client_body_timeout        10s;
    send_timeout               10s;

    # ── Generierte Env-Blöcke (entrypoint.sh) ──────────────────────
    # upstream gateway_backend (aus GATEWAY_UPSTREAM)
    include /etc/nginx/generated/upstream.conf;
    # geo $whitelisted_ip (aus IP_WHITELIST, für Logging/ frühe Prüfung)
    include /etc/nginx/generated/geo.conf;

    # ── WAF-Maps + Rate-Limit-Zonen (siehe waf.conf) ──────────────
    include /etc/nginx/waf.conf;

    # ── Logging inkl. Whitelist-Treffer-Flag ───────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'wl=$whitelisted_ip rt=$request_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Port 80: ausschließlich Redirect auf TLS ───────────────────
    server {
        listen       80 default_server;
        listen [::]:80 default_server;
        server_name  _;

        # Whitelist-Check VOR dem Redirect. Hinweis: allow/deny greift in
        # der Access-Phase, ein serverweites "return" finalisiert aber
        # bereits in der Rewrite-Phase — deshalb hier der geo-Check als
        # if (mit return ist die dokumentierte sichere if-Ausnahme).
        if ($whitelisted_ip = 0) { return 403; }
        return 301 https://$host$request_uri;
    }

    # ── Port 443: einziger Dienst-Endpunkt ─────────────────────────
    server {
        listen      443 ssl default_server;
        listen      [::]:443 ssl default_server;
        http2 on;                      # nginx >= 1.25.1
        server_name _;

        # TLS-Material (aus /etc/nginx/certs oder Self-Signed-Fallback,
        # generiert von entrypoint.sh)
        include /etc/nginx/generated/ssl.conf;

        # TLS-Härtung
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;   # Client-Picking für TLS 1.3 ok
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # ── 1) IP-Whitelist: allow/deny im Server-Kontext (Access-
        #       Phase), generiert aus IP_WHITELIST. Standard: deny all. ─
        include /etc/nginx/generated/allow.conf;

        # Frühe Verwerfung in der Rewrite-Phase (Defense in Depth, s.o.):
        if ($whitelisted_ip = 0)  { return 403; }

        # ── 2) WAF: genau ZWEI if-Entscheidungen, Ergebnis kommt als
        #       Map-Flag aus waf.conf — keine if-Ketten. ──────────────
        if ($waf_bad_method = 1)  { return 405; }  # nur GET/POST
        if ($waf_blocked = 1)     { return 403; }  # verdächtige Payloads

        # ── 3) Rate-Limit / Connection-Limit pro Client-IP ──────────
        limit_req  zone=req_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;

        # ── Sicherheits-Header (auch auf Fehlerantworten: "always") ─
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;

        # ── 4) EINZIGE weitergeleitete Route: /api/ → gateway ──────
        location /api/ {
            proxy_pass         http://gateway_backend;
            proxy_http_version 1.1;

            # Echte Client-IP weiterreichen. Eingehendes X-Forwarded-For
            # wird bewusst NICHT übernommen (Spoofing-Schutz).
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";   # Upstream-Keepalive

            proxy_connect_timeout 5s;
            proxy_send_timeout   30s;
            proxy_read_timeout   30s;
            proxy_buffering      on;

            # Server-Tokens des Upstreams verstecken
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
        }

        # ── 5) Alles andere: keine Route → 404, kein Proxy,
        #       kein Directory-Listing, keine statischen Dateien ─────
        location / {
            return 404;
        }
    }
}
